name: Deploy
on:
  push:
    branches:
      - master
    
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Cache dependencies
        uses: actions/cache@v6
        id: cache
        with:
          path: ~/.npm
          key: node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        id: run-tests
        run: npm test
      - name: Upload test report
        if: failure() && steps.run-tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: test.json
  build:
    needs: test 
    runs-on: ubuntu-latest
    outputs:
      js-filename: ${{ steps.get-js-filename.outputs.js-filename-var }}
    steps:
      - name: Get code
        id: cache
        uses: actions/checkout@v7
      # runner already has pre-installed NodeJS, this step just for test purposes
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Build code
        id: build-code
        run: npm run build
      - name: Get js filename
        id: get-js-filename
        run: find dist/assets/*.js -type f -execdir echo 'js-filename-var={}' >> $GITHUB_OUTPUT ';'
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-files
          path: dist
          # path: |
          #   dist
          #   package.json
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get built artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-files
      - name: Output contents
        run: ls
      - name: Output js filename
        run: echo "${{ needs.build.outputs.js-filename }}"
      - name: Deploy
        run: echo "=== Deploying ==="
  report:
    if: failure()
    needs: [lint, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Print dummy data
        run: echo "=== Print report ==="




