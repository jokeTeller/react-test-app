name: Matrix
on:
  workflow_dispatch:
    
jobs:
  build:
    strategy:
      matrix:
        node-version: [10, 22, 24]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Install Node
        uses: actions/setup-node@v7
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build



